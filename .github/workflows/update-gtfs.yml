name: Update Static GTFS
run-name: Update Static GTFS Data to Database

on:
  schedule:
    # Runs every month
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-gtfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.11.2'
          run_install: true

      - name: Install Dependencies
        run: pnpm install

      - name: Download - Parse - Upload
        working-directory: './'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_ACCESS: ${{ secrets.R2_SECRET_ACCESS }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
        run: |
          tsc --project tsconfig.scripts.json
          node ./scripts/updateStaticGTFS.ts
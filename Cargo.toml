[package]
name = "pt_backend"
version = "0.1.0"
edition = "2024"
build="src/build.rs"

[dependencies]
axum = "0.8.9"
axum-streams = { version = "0.30.0", features = ["json", "text"] }
hyper = { version = "1.12.0", features = ["full"] }
redis = { version = "1.7.1", features = ["connection-manager", "tokio-comp", "tokio-rustls-comp"] }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower = "0.5.3"
vercel_runtime = { version = "2.4.1", features = ["axum"] }
prost = "0.14"
base64 = "0.23.1"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.3.0"

[[bin]]
name = "axum"
path = "api/axum.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

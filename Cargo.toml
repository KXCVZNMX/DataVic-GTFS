[package]
name = "pt_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-streams = { version = "0.30.0", features = ["json", "text"] }
hyper = { version = "1.12.0", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower = "0.5.3"
vercel_runtime = { version = "2.4.1", features = ["axum"] }

[[bin]]
name = "axum"
path = "api/axum.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
